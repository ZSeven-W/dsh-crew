# pnpm 11 reads build-script approval from here; the old `pnpm` key in
# package.json is ignored (and a malformed `allowBuilds` block once lived
# here — numeric keys and placeholder text, which pnpm never read either).
onlyBuiltDependencies:
  - '@deepseek-ai/dsh-subprocess-local'
  - esbuild
  - koffi
  - node-pty
