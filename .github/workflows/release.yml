# Publish to npm when a version tag is pushed.
#
# Authentication, in preference order:
# 1. npm trusted publishing (OIDC) — the workflow proves its identity to the
#    registry, which is why `permissions.id-token` is present. One-time setup
#    on npmjs.com, under the package's Settings -> Trusted Publisher: pick
#    GitHub Actions, then name this repository and this file (release.yml).
# 2. The NPM_TOKEN repository secret — npm >= 11.5 falls back to it when the
#    OIDC exchange is unavailable (no trusted publisher configured yet). The
#    token must be an Automation (or granular publish) token, or npm will
#    demand a one-time password no CI run can type.
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The bundled npm predates trusted publishing. Pinned to the major so a
      # future npm (which may e.g. reject setup-node's `always-auth` npmrc key
      # it currently only warns about) cannot break a release out of nowhere.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # The tag must match what is about to be published, or the release
      # silently ships a version nobody asked for.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      # Rebuild the committed artifacts from the tagged sources and prove the
      # bundle still starts: lib/client.js and lib/server.mjs are what the
      # host actually loads, and a stale one would ship unnoticed.
      - name: Build and smoke-test the bundle
        run: pnpm run build && pnpm run smoke:mcp

      # smoke:pack installs the packed tarball the way a user would and is the
      # only check that all four version fields agree. It never ran here, and
      # 0.1.0-rc.5 shipped with plugin.json and serverInfo a version behind.
      - name: Smoke-test the packed tarball
        run: pnpm run smoke:pack

      # A prerelease must never take the `latest` dist-tag: `npm install`
      # with no version would hand it to everyone.
      #
      # Publishing is skipped when the registry already has this version.
      # npm refuses to publish over an existing version, so without the guard
      # a re-pushed tag — or a version first published by hand — turns the
      # release red for a reason nobody needs to act on.
      - name: Publish
        env:
          # Fallback credential for the OIDC-less case; setup-node's npmrc
          # references exactly this variable. npm tries the trusted-publishing
          # exchange first and only then reads the token, so configuring the
          # trusted publisher later needs no workflow change.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          pkg="$(node -p "require('./package.json').version")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "$name@$pkg is already on the registry — nothing to publish."
            exit 0
          fi
          case "$pkg" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          npm publish --access public --tag "$dist_tag"
